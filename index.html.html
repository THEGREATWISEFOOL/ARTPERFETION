<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ASCII Art Animation</title>
    <style>
        body {
            background-color: black;
            color: lime;
            font-family: monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        pre {
            white-space: pre-wrap;
            text-align: left;
            font-size: 16px;
        }
        #footer {
            margin-top: 20px;
            color: white;
        }
        button {
            background: none;
            border: none;
            color: cyan;
            font-size: 18px;
            cursor: pointer;
            text-decoration: underline;
        }
    </style>
</head>
<body>

<button onclick="showArt()">Click here to open ASCII Art</button>
<pre id="art"></pre>
<div id="footer">by Rayver</div>

<script>
const art = [
    "         / \\         ",
    "        |\\_/|        ",
    "        |---|        ",
    "        |   |        ",
    "        |   |        ",
    "      _ |=-=| _      ",
    "  _  / \\|   |/ \\     ",
    " / \\|   |   |   ||\\  ",
    "|   |   |   |   | \\> ",
    "|   |   |   |   |   \\",
    "| -   -   -   - |)   )",
    "|                   / ",
    " \\                 /  ",
    "  \\               /   ",
    "   \\             /    ",
    "    \\           /     ",
    "        JOKE:)         "
];

function showArt() {
    const artContainer = document.getElementById("art");
    artContainer.textContent = ""; // clear previous content
    let lineIndex = 0;

    function typeLine() {
        if (lineIndex >= art.length) return;
        let line = art[lineIndex];
        let charIndex = 0;

        function typeChar() {
            if (charIndex < line.length) {
                artContainer.textContent += line[charIndex];
                charIndex++;
                setTimeout(typeChar, 20);
            } else {
                artContainer.textContent += "\n";
                lineIndex++;
                setTimeout(typeLine, 100);
            }
        }
        typeChar();
    }

    typeLine();
}
</script>

</body>
</html>
